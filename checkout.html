<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unmask.tools — Confirm your order</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:      #f8fafc;
      --c-surface: #ffffff;
      --c-border:  #e2e8f0;
      --c-text:    #0f172a;
      --c-muted:   #64748b;
      --c-accent:  #009EDB;
    }

    body { background: var(--c-bg); color: var(--c-text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }

    main { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }

    h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .meta { color: var(--c-muted); font-size: 12px; margin-bottom: 32px; }

    .order-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .order-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; flex-wrap: wrap; }
    .order-row + .order-row { border-top: 1px solid var(--c-border); }
    .order-label { color: var(--c-muted); font-size: 13px; }
    .order-value { font-weight: 700; font-size: 14px; }
    .order-value.price { font-size: 20px; }
    .order-value.price span { font-size: 12px; font-weight: 400; color: var(--c-muted); }
    .order-value.plain { font-weight: 400; font-size: 13px; color: var(--c-muted); }

    .features-label { color: var(--c-muted); font-size: 13px; padding: 10px 0 4px; border-top: 1px solid var(--c-border); margin-top: 4px; }
    .features-list { list-style: none; display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
    .features-list li { font-size: 13px; color: var(--c-text); display: flex; align-items: flex-start; gap: 8px; }
    .features-list li::before { content: '✓'; color: #009EDB; font-weight: 700; flex-shrink: 0; }

    .info-block {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      color: #0369a1;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .info-block ul { margin: 6px 0 0; padding-left: 18px; }
    .info-block li { margin-bottom: 4px; }
    .info-block a { color: #0369a1; font-weight: 600; }

    .consent-box {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .consent-row input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--c-accent);
      cursor: pointer;
    }
    .consent-row label { font-size: 13px; color: var(--c-text); line-height: 1.55; cursor: pointer; }
    .consent-row label a { color: var(--c-accent); }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 13px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn-primary { background: #009EDB; color: #fff; }
    .btn-primary:hover:not([aria-disabled="true"]) { opacity: 0.88; }
    .btn-primary[aria-disabled="true"] {
      background: var(--c-border);
      color: var(--c-muted);
      cursor: not-allowed;
      pointer-events: none;
    }

    .checkout-hint { text-align: center; font-size: 11.5px; color: var(--c-muted); margin-top: 10px; }
    .checkout-hint a { color: var(--c-accent); text-decoration: none; }
    .checkout-hint a:hover { text-decoration: underline; }

    .error-card { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 20px; color: #b91c1c; font-size: 13px; }
    .error-card a { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body data-page="checkout">

<script src="/nav.js"></script>

<main>
  <div id="checkoutContent"></div>
</main>

<script>
  const TIERS = {
    pro: {
      name: 'Pro',
      price: '€15',
      interval: 'month',
      stripeUrl: 'https://buy.stripe.com/00weVdci26OQ4rG2l914402',
      features: [
        'Static phrase detection',
        '300 AI scans / day',
        'unmask.filter bot template (Claude · Gemini · ChatGPT)',
        '1 seat',
        'Priority support',
      ],
    },
    team: {
      name: 'Team',
      price: '€59',
      interval: 'month',
      stripeUrl: 'https://buy.stripe.com/9B6dR91Doa12aQ45xl14403',
      features: [
        'Static phrase detection',
        '1,500 AI scans / day (shared)',
        'API access included',
        'Unlimited seats — 1 key',
        'Company phrase repository',
        'MDM deployment (Chrome Enterprise / Intune / Jamf)',
        'unmask.filter bot template (Claude · Gemini · ChatGPT)',
        'Priority support',
      ],
    },
    enterprise: {
      name: 'Enterprise',
      price: '€199',
      interval: 'month',
      stripeUrl: 'https://buy.stripe.com/3cI00j5TEddeaQ49NB14401',
      features: [
        'Static phrase detection',
        '5,000 AI scans / day (shared)',
        'API access included',
        'Unlimited seats — 1 key',
        'Company phrase repository',
        'MDM deployment (Chrome Enterprise / Intune / Jamf)',
        'unmask.filter bot template (Claude · Gemini · ChatGPT)',
        'Onboarding call included',
      ],
    },
  };

  const params = new URLSearchParams(location.search);
  const tierKey = params.get('tier');
  const tier = TIERS[tierKey];
  const content = document.getElementById('checkoutContent');

  if (!tier) {
    content.innerHTML = `
      <h2>Confirm your order</h2>
      <p class="meta">&nbsp;</p>
      <div class="error-card">
        We couldn't identify which plan you selected. Please go back to <a href="pricing.html">pricing</a> and choose a plan again.
      </div>
    `;
  } else {
    content.innerHTML = `
      <h2>Confirm your order</h2>
      <p class="meta">Last step before payment · unmask.tools ${tier.name} subscription</p>

      <div class="order-card">
        <div class="order-row">
          <span class="order-label">Plan</span>
          <span class="order-value">${tier.name}</span>
        </div>
        <div class="order-row">
          <span class="order-label">Price</span>
          <span class="order-value price">${tier.price} <span>/ ${tier.interval} — final price, no VAT is added · billed monthly, auto-renews until cancelled</span></span>
        </div>
        <div class="order-row">
          <span class="order-label">Contract term</span>
          <span class="order-value plain">No minimum term — cancel any time, effective end of current billing period. See <a href="terms.html" style="color:var(--c-accent);">Terms §5</a>.</span>
        </div>
        <div class="features-label">What's included</div>
        <ul class="features-list">
          ${tier.features.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>

      <div class="info-block">
        <strong>Before you continue:</strong>
        <ul>
          <li>Payment is processed by Stripe. Access to the ${tier.name} plan begins immediately once payment succeeds.</li>
          <li>No VAT is charged. The operator is a small business under § 6 (1) 27 of the Austrian VAT Act (Kleinunternehmerregelung, UStG), so the price shown is the total amount payable.</li>
          <li>You have a statutory 14-day right of withdrawal — see <a href="terms.html">Terms §6</a> and the mandatory consent below.</li>
          <li>Statutory warranty rights for digital services apply and are unaffected by this purchase — see <a href="terms.html">Terms §8</a>.</li>
          <li>Business details (operator, address, contact) are listed in our <a href="imprint.html">Imprint</a>.</li>
        </ul>
      </div>

      <div class="consent-box">
        <div class="consent-row">
          <input type="checkbox" id="consentCheckbox">
          <label for="consentCheckbox">
            I expressly request that unmask.tools begin providing the digital service before expiry of the 14-day withdrawal period. I am aware that, in the event of withdrawal, I may owe reasonable compensation for the value of services already provided up to the point of withdrawal.
          </label>
        </div>
        <div class="consent-row">
          <input type="checkbox" id="termsCheckbox">
          <label for="termsCheckbox">
            I have read and accept the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.
          </label>
        </div>
      </div>

      <a href="#" id="continueBtn" class="btn btn-primary" aria-disabled="true">Continue to payment →</a>
      <p class="checkout-hint">You'll be redirected to Stripe to complete payment securely.</p>
    `;

    const consentCheckbox = document.getElementById('consentCheckbox');
    const termsCheckbox = document.getElementById('termsCheckbox');
    const continueBtn = document.getElementById('continueBtn');

    function updateButtonState() {
      const bothChecked = consentCheckbox.checked && termsCheckbox.checked;
      continueBtn.setAttribute('aria-disabled', bothChecked ? 'false' : 'true');
    }

    consentCheckbox.addEventListener('change', updateButtonState);
    termsCheckbox.addEventListener('change', updateButtonState);

    continueBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!consentCheckbox.checked || !termsCheckbox.checked) return;
      window.location.href = tier.stripeUrl;
    });
  }
</script>

<script src="/footer.js"></script>
</body>
</html>
